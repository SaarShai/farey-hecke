[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coprimebatch"
version = "0.1.0"
description = "Exact gap-permutation and complete coprime-batch discrepancy certificates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
coprimebatch = "coprimebatch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

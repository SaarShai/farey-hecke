<title>The exact onset value X_Omega(q) equals 1 over lambda_q cubed, machine-verified for q from 5 to 21</title>
<desc>A descending curve of the onset value versus q with all 17 integer points q=5 to 21 marked, dropping from 0.236 at q=5 toward the dashed asymptote at one eighth.</desc>
<text class="th" x="40" y="34">the onset value X_Ω(q) = 1/λ_q³ , machine-verified for q = 5…21</text>


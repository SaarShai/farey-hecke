<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 300" role="img">
<style>.th{font:500 22px -apple-system,sans-serif;fill:#1a1a1a}.t{font:400 16px -apple-system,sans-serif;fill:#2c2c2a}.ts{font:400 13px -apple-system,sans-serif;fill:#5f5e5a}</style>
<title>The mechanism for q=13, before versus after, with real numbers</title>
<desc>A real run of 4 gap-products at q=13 (0.119, 0.135, 0.135, 0.119), all below 0.1366. Left: observed, unexplained. Right: the same points are one rotation of 13.85 degrees on a constant-energy ellipse (E=0.0080), ejecting at 0.304.</desc>
<text class="th" x="40" y="28">figure 1 — the mechanism: before vs after  (example q = 13)</text>
<line x1="340" y1="44" x2="340" y2="238" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="56" y="58" fill="#5F5E5A">known before</text>
<text class="ts" x="420" y="58" fill="#0C447C">what our work adds</text>
<line x1="60" y1="134" x2="300" y2="134" stroke="#BA7517" stroke-width="1.1" stroke-dasharray="5 3"/>
<text class="ts" x="60" y="128">threshold 1/λ³ = 0.1366</text>
<path d="M96 162 Q192 130 288 162" fill="none" stroke="#B4B2A9" stroke-width="1.2"/>
<g fill="#B4B2A9"><circle cx="96" cy="162" r="6"/><circle cx="160" cy="144" r="6"/><circle cx="224" cy="144" r="6"/><circle cx="288" cy="162" r="6"/></g>
<text class="ts" x="62" y="182">0.119</text><text class="ts" x="176" y="138">0.135</text><text class="ts" x="262" y="182">0.119</text>
<text x="180" y="112" fill="#888780" style="font:500 24px sans-serif">?</text>
<text class="ts" x="56" y="206" fill="#5F5E5A">a run of 4 gaps, all just below 0.1366 —</text>
<text class="ts" x="56" y="222" fill="#5F5E5A">observed, but the cause was unknown</text>
<ellipse cx="500" cy="168" rx="100" ry="42" fill="none" stroke="#888780" stroke-width="1.2"/>
<line x1="404" y1="132" x2="596" y2="132" stroke="#BA7517" stroke-width="1.1" stroke-dasharray="5 3"/>
<text class="ts" x="556" y="128">0.1366</text>
<path d="M420 150 Q500 130 580 150" fill="none" stroke="#1D9E75" stroke-width="9" opacity="0.22" stroke-linecap="round"/>
<g fill="#1D9E75"><circle cx="420" cy="150" r="5"/><circle cx="470" cy="138" r="5"/><circle cx="530" cy="138" r="5"/><circle cx="580" cy="150" r="5"/></g>
<path d="M462 134 A 44 16 0 0 1 538 134" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#ar1)"/>
<text class="ts" x="430" y="120">13.85° (= π/13) each step</text>
<text class="ts" x="408" y="176" fill="#0C447C">E = 0.0080, constant along the run</text>
<circle cx="596" cy="188" r="6" fill="#E24B4A"/>
<text class="ts" x="468" y="206" fill="#A32D2D">ejects at a·b = 0.304</text>
<rect x="40" y="250" width="600" height="30" rx="6" fill="#EAF3DE"/>
<text class="t" x="54" y="270" fill="#27500A">new: the run is a rotation by π/q on a constant-energy ellipse (the cause) — proven</text>
<defs><marker id="ar1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#1D9E75"/></marker></defs>
</svg>

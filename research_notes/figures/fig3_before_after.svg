<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 300" role="img">
<style>.th{font:500 22px -apple-system,sans-serif;fill:#1a1a1a}.t{font:400 16px -apple-system,sans-serif;fill:#2c2c2a}.ts{font:400 13px -apple-system,sans-serif;fill:#5f5e5a}</style>
<title>Cluster size: conjecture versus theorem, with real q and B numbers</title>
<desc>Left: the conjectured formula predicts B=3,4,5,5 at q=7,13,19,23. Right: actual values 3,4,5,6 — at q=23 the value jumps from a predicted 5 to an actual 6, so the formula is false; the true rule is an even-odd parity gate.</desc>
<text class="th" x="40" y="28">figure 3 — cluster size B(q): conjecture vs theorem</text>
<line x1="340" y1="44" x2="340" y2="238" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="56" y="58" fill="#5F5E5A">what we conjectured</text>
<text class="ts" x="420" y="58" fill="#0C447C">what we proved</text>
<text class="ts" x="44" y="100" transform="rotate(-90 44 100)">B (max cluster)</text>
<line x1="62" y1="205" x2="305" y2="108" stroke="#B4B2A9" stroke-width="1.5"/>
<g fill="#B4B2A9"><circle cx="90" cy="182" r="5"/><circle cx="160" cy="154" r="5"/><circle cx="230" cy="126" r="5"/><circle cx="288" cy="113" r="5"/></g>
<g class="ts" fill="#5F5E5A"><text x="84" y="174">3</text><text x="154" y="146">4</text><text x="224" y="118">5</text><text x="282" y="105">5</text></g>
<g class="ts" fill="#888780"><text x="84" y="222">q7</text><text x="150" y="222">q13</text><text x="220" y="222">q19</text><text x="278" y="222">q23</text></g>
<text class="ts" x="60" y="244" fill="#5F5E5A">formula B = 2 + ⌊(q−1)/6⌋  (conjectured)</text>
<text class="ts" x="404" y="222" fill="#888780">q7      q13      q19     q23</text>
<line x1="402" y1="205" x2="645" y2="108" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/>
<text class="ts" x="556" y="104" fill="#888780">predicted</text>
<g fill="#185FA5"><circle cx="420" cy="182" r="5"/><circle cx="486" cy="154" r="5"/><circle cx="552" cy="126" r="5"/></g>
<g class="ts" fill="#0C447C"><text x="414" y="174">3</text><text x="480" y="146">4</text><text x="546" y="118">5</text></g>
<circle cx="612" cy="113" r="5" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
<text class="ts" x="620" y="118" fill="#888780">5</text>
<path d="M612 108 L612 96" fill="none" stroke="#E24B4A" stroke-width="1.8" marker-end="url(#au)"/>
<circle cx="612" cy="90" r="6.5" fill="#E24B4A"/>
<text class="ts" x="620" y="90" fill="#A32D2D">6</text>
<text class="ts" x="470" y="150" fill="#A32D2D">q=23 jumps: 6, not 5</text>
<text class="ts" x="400" y="244" fill="#0C447C">true rule: even q → +1 (resonates), odd → blocked</text>
<rect x="40" y="252" width="600" height="30" rx="6" fill="#FCEBEB"/>
<text class="t" x="54" y="272" fill="#791F1F">new: the conjecture is false; the true rule is an even/odd parity gate — both proven</text>
<defs><marker id="au" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto"><path d="M0 6 L3 0 L6 6 z" fill="#E24B4A"/></marker></defs>
</svg>

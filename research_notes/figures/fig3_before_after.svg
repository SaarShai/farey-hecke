<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 300" role="img">
<style>.th{font:500 22px -apple-system,sans-serif;fill:#1a1a1a}.t{font:400 16px -apple-system,sans-serif;fill:#2c2c2a}.ts{font:400 13px -apple-system,sans-serif;fill:#5f5e5a}</style>
<title>The cluster-size rule: our conjecture versus the theorem we proved</title>
<desc>Left: a tidy formula we conjectured, dots on a line. Right: at q=23 the actual value jumps above the predicted (ghost) point, so the formula is false; the true rule is an even-odd parity gate.</desc>
<text class="th" x="40" y="30">figure 3 — cluster size: conjecture vs theorem</text>
<line x1="340" y1="46" x2="340" y2="240" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<text class="ts" x="56" y="60" fill="#5F5E5A">what we conjectured</text>
<text class="ts" x="420" y="60" fill="#0C447C">what we proved</text>
<line x1="62" y1="205" x2="300" y2="105" stroke="#B4B2A9" stroke-width="1.5"/>
<g fill="#B4B2A9"><circle cx="80" cy="197" r="5"/><circle cx="135" cy="174" r="5"/><circle cx="190" cy="151" r="5"/><circle cx="245" cy="128" r="5"/><circle cx="290" cy="109" r="5"/></g>
<text class="ts" x="60" y="232" fill="#5F5E5A">a tidy formula B = 2 + ⌊(q−1)/6⌋</text>
<text class="ts" x="150" y="248" fill="#5F5E5A">— only conjectured</text>
<line x1="402" y1="205" x2="640" y2="105" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/>
<text class="ts" x="560" y="100" fill="#888780">predicted</text>
<g fill="#185FA5"><circle cx="420" cy="197" r="5"/><circle cx="475" cy="174" r="5"/><circle cx="530" cy="151" r="5"/><circle cx="620" cy="109" r="5"/></g>
<circle cx="575" cy="132" r="5" fill="none" stroke="#B4B2A9" stroke-width="1.5"/>
<path d="M575 127 L575 114" fill="none" stroke="#E24B4A" stroke-width="1.8" marker-end="url(#au)"/>
<circle cx="575" cy="108" r="6.5" fill="#E24B4A"/>
<text class="ts" x="486" y="150" fill="#A32D2D">q=23: actual 6, not 5</text>
<text class="ts" x="400" y="226" fill="#0C447C">parity gate: even q → +1 (resonates),</text>
<text class="ts" x="400" y="242" fill="#0C447C">odd → blocked — and proven</text>
<rect x="40" y="258" width="600" height="30" rx="6" fill="#FCEBEB"/>
<text class="t" x="54" y="278" fill="#791F1F">new: the conjecture is false; the true rule is an even/odd parity gate — both proven</text>
<defs><marker id="au" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto"><path d="M0 6 L3 0 L6 6 z" fill="#E24B4A"/></marker></defs>
</svg>
